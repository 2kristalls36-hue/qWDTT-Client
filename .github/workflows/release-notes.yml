name: Release notes

# Replaces the description of an existing release with docs/releases/<tag>.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          file="docs/releases/${TAG}.md"
          test -f "$file" || { echo "No $file" >&2; exit 1; }
          gh release edit "$TAG" --notes-file "$file"
