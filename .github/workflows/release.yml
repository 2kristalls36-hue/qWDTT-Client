name: Release

# Publishes a GitHub Release with signed APKs; the app offers it in Settings → Updates.
# Two ways, both after raising versionName in app/build.gradle.kts on main:
#   - Actions → Release → Run workflow with «publish» ticked: the tag v<versionName>
#     is created by this workflow;
#   - or push a tag yourself: git tag v1.2.3 && git push origin v1.2.3
# Tags with -alpha/-beta/-rc become pre-releases, which the app does not offer.
# Manual run without «publish»: a signed test build as an artifact, no release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release tagged v<versionName>"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${GITHUB_REF_NAME#v}"
          gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$gradle_version"
          if [ "$version" != "$gradle_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $gradle_version" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go_client/go.mod

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret for $v is not set" >&2; exit 1; fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s\n' \
            "KEYSTORE_FILE=$keystore" \
            "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            "KEY_ALIAS=$KEY_ALIAS" \
            "KEY_PASSWORD=$KEY_PASSWORD" > local.properties

      - name: Test and build release APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a,x86_64 --no-daemon

      - name: Verify signatures and name APKs
        shell: bash
        run: |
          mkdir -p dist
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          else
            gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            version="${gradle_version}-test-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk" || continue
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
            base="$(basename "$apk")"
            arch="${base#app-}"
            arch="${arch%-release.apk}"
            cp "$apk" "dist/qwdtt-client-${version}-${arch}.apk"
            found=1
          done
          test "$found" = 1
          cd dist
          sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-client-${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APP_VERSION}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != main ]; then echo "Publish from main only" >&2; exit 1; fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists: raise versionName first" >&2; exit 1
            fi
          fi
          args=(--title "qWDTT Client ${tag}" --generate-notes --target "$GITHUB_SHA")
          case "$tag" in
            *-alpha*|*-beta*|*-rc*) args+=(--prerelease) ;;
          esac
          gh release create "$tag" dist/* "${args[@]}"
